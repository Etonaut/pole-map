<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกพิกัดเสาไฟฟ้า Real-time</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SheetJS (xlsx) สำหรับ Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- dom-to-image สำหรับ Export รูปภาพแผนที่ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #map { flex-grow: 1; width: 100%; }
        #controls { background: #ecf0f1; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; color: white; }
        .btn-save { background: #27ae60; }
        .btn-track { background: #2980b9; }
        .btn-track.active { background: #c0392b; }
        .btn-excel { background: #d35400; }
        .btn-image { background: #8e44ad; }
        button:hover { opacity: 0.9; }
        #log { max-height: 120px; overflow-y: auto; background: white; padding: 10px; width: 100%; font-size: 14px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

    <div id="header">
        <h2>⚡ ระบบบันทึกพิกัดเสาไฟฟ้า Real-time</h2>
    </div>

    <!-- ส่วนแสดงแผนที่ -->
    <div id="map-container" style="flex-grow: 1; display: flex; flex-direction: column; position: relative;">
        <div id="map" style="width: 100%; height: 100%;"></div>
    </div>

    <div id="controls">
        <button class="btn-save" onclick="saveCurrentLocation()">📍 บันทึกพิกัดเสาไฟ</button>
        <button id="trackBtn" class="btn-track" onclick="toggleTracking()">🛰️ เปิด/ปิด Tracking</button>
        <button class="btn-excel" onclick="exportToExcel()">📊 สรุป Excel</button>
        <button class="btn-image" onclick="exportMapImage()">📷 สรุปรูปภาพแผนที่</button>
    </div>

    <div id="log"><strong>ประวัติการบันทึก:</strong><ul id="logList" style="margin: 0; padding-left: 20px;"></ul></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ตั้งค่าเริ่มต้นแผนที่
        const map = L.map('map').setView([13.736717, 100.523186], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentMarker = null;
        let watchId = null;
        let isTracking = false;
        let savedPoints = []; 
        let pathLine = L.polyline([], {color: 'blue', weight: 4}).addTo(map);

        // บันทึกพิกัดปัจจุบัน
        function saveCurrentLocation() {
            if (!navigator.geolocation) {
                alert("เบราว์เซอร์ของคุณไม่รองรับ Geolocation");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const poleNumber = savedPoints.length + 1;
                const label = `เสาไฟฟ้าต้นที่ ${poleNumber}`;
                const timeString = new Date().toLocaleString('th-TH');

                addPoleMarker(lat, lng, label, timeString);
            }, error => {
                alert("ไม่สามารถดึงตำแหน่งได้: " + error.message);
            }, { enableHighAccuracy: true });
        }

        // เพิ่มหมุดเสาไฟฟ้าลงบนแผนที่
        function addPoleMarker(lat, lng, label, timeString) {
            const marker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>${label}</b><br>ละติจูด: ${lat.toFixed(6)}<br>ลองจิจูด: ${lng.toFixed(6)}`)
                .openPopup();

            savedPoints.push({
                "ลำดับ": savedPoints.length + 1,
                "รายการ": label,
                "ละติจูด (Latitude)": lat,
                "ลองจิจูด (Longitude)": lng,
                "เวลาที่บันทึก": timeString
            });
            
            const logList = document.getElementById('logList');
            const li = document.createElement('li');
            li.textContent = `${label} - Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)} (${timeString})`;
            logList.appendChild(li);

            map.setView([lat, lng], 17);
        }

        // เปิด-ปิด Real-time Tracking
        function toggleTracking() {
            const btn = document.getElementById('trackBtn');
            if (!isTracking) {
                if (!navigator.geolocation) {
                    alert("เบราว์เซอร์ไม่รองรับ Geolocation");
                    return;
                }
                isTracking = true;
                btn.textContent = "⏹️ ปิด Tracking";
                btn.classList.add('active');

                watchId = navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (!currentMarker) {
                        currentMarker = L.marker([lat, lng], {
                            icon: L.icon({
                                iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
                                iconSize: [32, 32]
                            })
                        }).addTo(map).bindPopup("📍 ตำแหน่งที่คุณกำลังเคลื่อนที่");
                    } else {
                        currentMarker.setLatLng([lat, lng]);
                    }

                    pathLine.addLatLng([lat, lng]);
                    map.panTo([lat, lng]);

                }, error => {
                    console.error(error);
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });

            } else {
                isTracking = false;
                btn.textContent = "🛰️ เปิด/ปิด Tracking";
                btn.classList.remove('active');
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
            }
        }

        // ฟังก์ชัน Export ข้อมูลเป็น Excel
        function exportToExcel() {
            if (savedPoints.length === 0) {
                alert("ยังไม่มีข้อมูลพิกัดเสาไฟฟ้า กรุณากดบันทึกพิกัดอย่างน้อย 1 จุด");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(savedPoints);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "พิกัดเสาไฟฟ้า");
            XLSX.writeFile(workbook, "pole-mapping-report.xlsx");
        }

        // ฟังก์ชัน Export แผนที่ออกเป็นรูปภาพ (PNG)
        function exportMapImage() {
            const mapElement = document.getElementById('map');
            
            // ใช้ dom-to-image จับภาพเฉพาะส่วนแผนที่ที่ปักหมุดไว้
            domtoimage.toPng(mapElement)
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = 'pole-map-summary.png';
                    link.href = dataUrl;
                    link.click();
                })
                .catch(function (error) {
                    console.error('เกิดข้อผิดพลาดในการสร้างรูปภาพ:', error);
                    alert("ไม่สามารถสร้างรูปภาพได้");
                });
        }
    </script>
</body>
</html>
