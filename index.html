<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกพิกัดเสาไฟฟ้า</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #capture-area { display: flex; flex-direction: column; flex-grow: 1; }
        #map { flex-grow: 1; min-height: 400px; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; background: #eee; }
        #log { height: 150px; overflow-y: auto; background: white; padding: 10px; border-top: 2px solid #ccc; font-size: 12px; }
        button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-save { background: #27ae60; }
        .btn-track { background: #2980b9; }
        .btn-excel { background: #d35400; }
        .btn-image { background: #8e44ad; }
        .marker-label { background: rgba(255,255,255,0.8); border: 1px solid #333; padding: 2px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="capture-area">
        <div id="map"></div>
        <div id="log">
            <strong>ตารางสรุปพิกัด:</strong>
            <ul id="logList"></ul>
        </div>
    </div>

    <div id="controls">
        <button class="btn-save" onclick="saveCurrentLocation()">📍 บันทึกเสาไฟ</button>
        <button class="btn-track" onclick="toggleTracking()">🛰️ Tracking</button>
        <button class="btn-excel" onclick="exportToExcel()">📊 Excel</button>
        <button class="btn-image" onclick="exportMapImage()">📷 รูปภาพ</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([13.7367, 100.5231], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let savedPoints = [];
        let isTracking = false;
        let watchId = null;

        function saveCurrentLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const time = new Date().toLocaleTimeString();
                
                // ปักหมุดพร้อม Label พิกัด
                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindTooltip(`Lat:${lat.toFixed(5)}, Lng:${lng.toFixed(5)}`, {
                    permanent: true, direction: 'top', className: 'marker-label'
                }).openTooltip();

                savedPoints.push({"ลำดับ": savedPoints.length + 1, "Lat": lat.toFixed(6), "Lng": lng.toFixed(6), "เวลา": time});
                document.getElementById('logList').innerHTML += `<li>ต้นที่ ${savedPoints.length}: ${lat.toFixed(5)}, ${lng.toFixed(5)} (${time})</li>`;
            }, null, { enableHighAccuracy: true });
        }

        function toggleTracking() {
            if(!isTracking) {
                isTracking = true;
                watchId = navigator.geolocation.watchPosition(pos => {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 17);
                }, null, { enableHighAccuracy: true });
            } else {
                isTracking = false;
                navigator.geolocation.clearWatch(watchId);
            }
        }

        function exportToExcel() {
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(savedPoints), "Data");
            XLSX.writeFile(wb, "pole-report.xlsx");
        }

        function exportMapImage() {
            html2canvas(document.getElementById('capture-area'), {useCORS: true}).then(canvas => {
                const link = document.createElement('a');
                link.download = 'pole-summary.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
